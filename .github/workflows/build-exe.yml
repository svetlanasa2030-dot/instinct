name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyautogui pyperclip

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed auto_message_sender.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: auto-message-sender-windows
          path: dist/auto_message_sender.exe
